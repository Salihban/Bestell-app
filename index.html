<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell APP</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/BestellLogo.svg">


    <script src="./scripts/objects.js"></script>
    <script src="./script.js" ></script>
    <script src="./scripts/template.js"></script>

<link rel="stylesheet" href="./styles/assets.css">
<link rel="stylesheet" href="./styles/basket.css">
<link rel="stylesheet" href="./styles/fonts.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="./styles/mediaScreen.css">
</head>
<body onload="init()">
        <header>
            <div class="headline">
                <img src="./assets/icons/BestellLogo.svg" alt="Bestellapp Logo">
                <img src="./assets/icons/menu.svg" alt="menu icon">
            </div>
        </header>
        <main>
            <div class="content-wrapper">
            <section class="landing">
                <div class="hero"><img src="./assets/icons/main-icon.png" alt="Main burger-icon"></div>
                <div class="landing_part2">
                    <div class="underHero">
                    <img src="./assets/icons/BurgerHouse.svg" alt="BurgerHouse">
                    <img src="./assets/icons/rating-icon.png" alt="">
                    </div>
                    <div class="hero-text"><p>The best of Burgers, Pizza, and Greens, all in one great place.</p></div>
                </div>
            </section>
                <div id="main-container">
            <section id="menu-dishes">
                <div class="balken">
                    <img src="./assets/icons/burger-icon.png" alt="burger icon">
                    <p>Burger & Sandwiches</p>
                </div>
                <div id="dish-section-Burger" class="menu-card"></div>
                <div class="balken">
                    <img src="./assets/icons/pizza-icon.png" alt="Pizza icon">
                    <p>Pizza  (30cm)</p>
                </div>
                <div id="dish-section-Pizza" class="menu-card"></div>
                <div class="balken">
                    <img src="./assets/icons/salad-icon.png" alt="Pizza icon">
                    <p>Salad</p>
                </div>
                <div id="dish-section-Salad" class="menu-card"></div>
            </section>
            <aside id="basket-aside">
                <div class="basket-wrapper">
            <div class="basket-titel">
                <h2>Your Basket</h2>
                <div><button class="basket-titel-btn" onclick="closeMobileBasket()">X</button></div>
            </div>
            <div id="basket-cart"></div>
            <div class="priceReport">
                <table class="table-list">
                    <tbody>
                        <tr>
                            <td>Subtotal</td>
                            <td id="subtotal-price">0.00€</td>
                        </tr>
                        <tr>
                            <td>Delivery Fee</td>
                            <td id="delivery-price">4.90€</td>
                        </tr>
                        <tr>
                            <td>Total</td>
                            <td id="total-price">0.00€</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="btnBuyNow">
            <button id="buy-now-btn" onclick="buyNow()">Buy now (0.00€)</button>
            </div>
            </div>
            </aside>
            </div>
            </div>
        </main>
        <footer>
            <div class="footline">
                <p>©️2025 BurgerHouse</p>
                <p>Imprint</p>
                <p>Cookie Preferences</p>
            </div>
        </footer>
        <nav id="mobil-navi">
            <button><img src="./assets/icons/home-icon-white.png" alt=""></button>
            <button><img src="./assets/icons/person-icon-white.png" alt=""></button>
            <button><img src="./assets/icons/orders.png" alt="">
            <button onclick="openMobileBasket()">
                <div class="mobile-basket-btn-wrapper">
                <img src="./assets/icons/shopping-cart-icon-white.png" alt=""></button>
                <span id="mobile-basket-counter" class="navi-badge">0</span>
                </div>
                </button>
        </nav>
        <div id="order-dialog" class="d-none">

            <div class="order-dialog-btn">
            <button class="btn-dialog" onclick="closeOrderDialog()">X</button>
            </div>

            <div class="order-dialog-img">
            <img src="./assets/icons/delivery-truck-icon.png" alt="delivery LKW">
            </div>

            <div class="order-dialog-text">
            <h2>Order confirmed!</h2>
            <p>your food is on the way!</p>
            </div>
        </div>
</body>
</html>
