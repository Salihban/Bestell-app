<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell APP</title>


    <script src="./scripts/objects.js"></script>
    <script src="./script.js" ></script>
    <script src="./scripts/template.js"></script>

<link rel="stylesheet" href="./styles/assets.css">
<link rel="stylesheet" href="./styles/basket.css">
<link rel="stylesheet" href="./styles/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body onload="init()">
        <header>
            <div class="headline">
                <img src="./assets/icons/BestellLogo.svg" alt="Bestellapp Logo">
                <img src="./assets/icons/menu.svg" alt="menu icon">
            </div>
        </header>

        <main>
            <section class="landing">
                <div class="hero"><img src="./assets/icons/main-icon.png" alt="Main burger-icon"></div>
                <div class="landing_part2">
                    <div class="underHero">
                    <img src="./assets/icons/BurgerHouse.svg" alt="BurgerHouse">
                    <img src="./assets/icons/rating-icon.png" alt="">
                    </div>
                    <div class="hero-text"><p>The best of Burgers, Pizza, and Greens, all in one great place.</p></div>
                </div>
            </section>
            <div class="balken">
                    <img src="./assets/icons/burger-icon.png" alt="burger icon">
                    <p>Burger & Sandwiches</p>
                </div>
            <section id="burger">
                <div class="content">
                    <div id="burgerCard" class="menu-card"></div>
                </div>
            </section>
            <div class="balken">
                    <img src="./assets/icons/pizza-icon.png" alt="Pizza icon">
                    <p>Pizza  (30cm)</p>
            </div>
            <section id="pasta">
                <div class="content">
                    <div id="pizzaCard" class="menu-card"></div>
                </div>
            </section>
            <div class="balken">
                    <img src="./assets/icons/salad-icon.png" alt="Pizza icon">
                    <p>Salad</p>
            </div>
            <section id="salad">
                <div class="content">
                    <div id="saladCard" class="menu-card"></div>
                </div>
            </section>
            
        </main>
        <aside>
            <div class="content">
                <div id="cart"></div>
            </div>
        </aside>
        <footer>
            <div class="footline">
                <img src="./assets/icons/imprint.svg" alt="Footer imprint">
            </div>
        </footer>
</body>
</html>
