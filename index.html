<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell APP</title>


    <script src="./script.js" defer></script>
    <script src="./scripts/objects.js"></script>
    <script src="./scripts/template.js"></script>

<link rel="stylesheet" href="./styles/assets.css">
<link rel="stylesheet" href="./styles/basket.css">
<link rel="stylesheet" href="./styles/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body onload="init()">
        <header>
            <div class="headline">
                <img src="./assets/icons/BestellLogo.svg" alt="Bestellapp Logo">
                <img src="./assets/icons/menu.svg" alt="menu icon">
            </div>
        </header>

        <main>
            <section class="landing">
                <div><img src="./assets/icons/main-icon.png" alt="Main burger-icon">
            </section>
            <section id="burger" class="green">
                <div class="balken"></div>
                <div id="burgerCard" class="content"></div>
            </section>
            <section id="pasta" class="purple">
                <div class="balken"></div>
                <div class="content">
                    <div class="menu-card"></div>
                </div>
            </section>
        </main>
        <aside>
            <div class="content">
                <div id="cart"></div>
            </div>
        </aside>
        <footer>
            <div class="footline">
                <img src="./assets/icons/imprint.svg" alt="Footer imprint">
            </div>
        </footer>
</body>
</html>
