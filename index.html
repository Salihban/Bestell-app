<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell APP</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/BestellLogo.svg">


    <script src="./scripts/objects.js"></script>
    <script src="./script.js" ></script>
    <script src="./scripts/template.js"></script>

<link rel="stylesheet" href="./styles/assets.css">
<link rel="stylesheet" href="./styles/basket.css">
<link rel="stylesheet" href="./styles/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body onload="init()">
        <header>
            <div class="headline">
                <img src="./assets/icons/BestellLogo.svg" alt="Bestellapp Logo">
                <img src="./assets/icons/menu.svg" alt="menu icon">
            </div>
        </header>

        <main>
            <section class="landing">
                <div class="hero"><img src="./assets/icons/main-icon.png" alt="Main burger-icon"></div>
                <div class="landing_part2">
                    <div class="underHero">
                    <img src="./assets/icons/BurgerHouse.svg" alt="BurgerHouse">
                    <img src="./assets/icons/rating-icon.png" alt="">
                    </div>
                    <div class="hero-text"><p>The best of Burgers, Pizza, and Greens, all in one great place.</p></div>
                </div>
            </section>
                <div id="main-container">
            <section id="menu-dishes">
                <div class="balken">
                    <img src="./assets/icons/burger-icon.png" alt="burger icon">
                    <p>Burger & Sandwiches</p>
                </div>
                <div id="dish-section-Burger" class="menu-card"></div>
                <div class="balken">
                    <img src="./assets/icons/pizza-icon.png" alt="Pizza icon">
                    <p>Pizza  (30cm)</p>
                </div>
                <div id="dish-section-Pizza" class="menu-card"></div>
                <div class="balken">
                    <img src="./assets/icons/salad-icon.png" alt="Pizza icon">
                    <p>Salad</p>
                </div>
                <div id="dish-section-Salad" class="menu-card"></div>
            </section>
            <aside>
                <div class="basket-wrapper">
            <div class="basket-titel">
                <h2>Your Basket</h2>
            </div>
            <div id="basket-cart"></div>
            <div class="priceReport">
                <table class="table-list">
                    <tbody>
                        <tr>
                            <td>Subtotal</td>
                            <td>${basketSubtotal}€</td>
                        </tr>
                        <tr>
                            <td>Delivery Fee</td>
                            <td>${displayDelivery}€</td>
                        </tr>
                        <tr>
                            <td>Total</td>
                            <td>${displayTotal}€</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="btnBuyNow">
            <button>Buy now (${displayTotal})</button>
            </div>
            </div>
            </aside>
            </div>
        </main>
        <footer>
            <div class="footline">
                <img src="./assets/icons/imprint.svg" alt="Footer imprint">
            </div>
        </footer>
</body>
</html>
